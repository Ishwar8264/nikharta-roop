<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="3014" viewBox="0 0 1440 3014" role="img" aria-labelledby="title desc">
<title id="title">NikhartaRoop System Documentation Page 005</title>
<desc id="desc">Text-preserving SVG conversion of NikhartaRoop System Documentation - Page 005 from NikhartaRoop_SystemDoc.docx.</desc>
<rect width="100%" height="100%" fill="#fffaf6"/>
<text x="64" y="40" font-family="Inter, Noto Sans Devanagari, Arial, sans-serif" font-size="18" font-weight="700" fill="#880E4F">NikhartaRoop System Documentation - Page 005</text>
<g font-family="Noto Sans Devanagari, Inter, Arial, sans-serif" font-size="16" fill="#212121">
<text x="64" y="78"> </text>
<text x="64" y="102">4. Authentication System</text>
<text x="64" y="126">4.1 Why OTP-Based Login?</text>
<text x="64" y="150">Indian mobile users are not comfortable remembering passwords. OTP via SMS is the most</text>
<text x="64" y="174">trusted and widely used authentication method in India, used by PhonePe, Paytm, Swiggy, and</text>
<text x="64" y="198">every major Indian app. It also eliminates the risk of users forgetting passwords.</text>
<text x="64" y="222"> </text>
<text x="64" y="246">4.2 Step-by-Step OTP Login Flow</text>
<text x="64" y="270">Step</text>
<text x="64" y="294">User Action</text>
<text x="64" y="318">System Action</text>
<text x="64" y="342">Storage</text>
<text x="64" y="366">1 — Enter Mobile</text>
<text x="64" y="390">User types 10-digit mobile number</text>
<text x="64" y="414">Validates number format (10 digits, India)</text>
<text x="64" y="438">Nothing stored yet</text>
<text x="64" y="462">2 — Request OTP</text>
<text x="64" y="486">User taps 'Send OTP'</text>
<text x="64" y="510">Generates 6-digit OTP, stores in Redis with 5-minute expiry</text>
<text x="64" y="534">Redis: key = mobile, value = OTP</text>
<text x="64" y="558">3 — Send SMS</text>
<text x="64" y="582">User waits for SMS</text>
<text x="64" y="606">Calls MSG91 API to send OTP SMS</text>
<text x="64" y="630">Logs send attempt</text>
<text x="64" y="654">4 — Enter OTP</text>
<text x="64" y="678">User types 6-digit OTP</text>
<text x="64" y="702">Client sends mobile + OTP to POST /auth/verify-otp</text>
<text x="64" y="726">Nothing yet</text>
<text x="64" y="750">5 — Verify</text>
<text x="64" y="774">System checks</text>
<text x="64" y="798">Compares OTP with Redis value, checks expiry</text>
<text x="64" y="822">Redis lookup</text>
<text x="64" y="846">6 — New User?</text>
<text x="64" y="870">System checks</text>
<text x="64" y="894">Queries Users table for this mobile number</text>
<text x="64" y="918">DB lookup</text>
<text x="64" y="942">6a — New User</text>
<text x="64" y="966">Auto registration</text>
<text x="64" y="990">Creates new User record with mobile, assigns USER role</text>
<text x="64" y="1014">DB: Users table</text>
<text x="64" y="1038">6b — Existing User</text>
<text x="64" y="1062">Login</text>
<text x="64" y="1086">Fetches existing user record</text>
<text x="64" y="1110">DB: Users table</text>
<text x="64" y="1134">7 — Generate Token</text>
<text x="64" y="1158">System creates JWT</text>
<text x="64" y="1182">JWT contains: userId, role, mobile, expiry (7 days)</text>
<text x="64" y="1206">Client localStorage / Secure storage</text>
<text x="64" y="1230">8 — Response</text>
<text x="64" y="1254">App receives token</text>
<text x="64" y="1278">Returns user profile + JWT token to app</text>
<text x="64" y="1302">App secure storage</text>
<text x="64" y="1326">9 — Delete OTP</text>
<text x="64" y="1350">Background cleanup</text>
<text x="64" y="1374">Deletes OTP from Redis to prevent reuse</text>
<text x="64" y="1398">Redis: key deleted</text>
<text x="64" y="1422"> </text>
<text x="64" y="1446">4.3 JWT Token Structure</text>
<text x="64" y="1470">JWT (JSON Web Token) is a compact, self-contained token that carries user identity without</text>
<text x="64" y="1494">hitting the database on every request. It has three parts: Header, Payload, and Signature.</text>
<text x="64" y="1518"> </text>
<text x="64" y="1542">JWT Field</text>
<text x="64" y="1566">Value Example</text>
<text x="64" y="1590">Purpose</text>
<text x="64" y="1614">userId</text>
<text x="64" y="1638">usr_7283hd72</text>
<text x="64" y="1662">Unique user identifier</text>
<text x="64" y="1686">role</text>
<text x="64" y="1710">USER / ADMIN / STAFF</text>
<text x="64" y="1734">Used for RBAC checks on every API</text>
<text x="64" y="1758">mobile</text>
<text x="64" y="1782">98xxxxxxxx</text>
<text x="64" y="1806">Reference to user's phone</text>
<text x="64" y="1830">branchId</text>
<text x="64" y="1854">branch_delhi_001</text>
<text x="64" y="1878">Which branch this staff/admin belongs to</text>
<text x="64" y="1902">iat</text>
<text x="64" y="1926">Unix timestamp</text>
<text x="64" y="1950">Issued At — when the token was created</text>
<text x="64" y="1974">exp</text>
<text x="64" y="1998">iat + 7 days</text>
<text x="64" y="2022">Expiry time — after this, token is invalid</text>
<text x="64" y="2046"> </text>
<text x="64" y="2070">4.4 Session Lifecycle</text>
<text x="64" y="2094">	•	User logs in → JWT token created with 7-day expiry.</text>
<text x="64" y="2118">	•	App stores token in secure storage (Keychain on iOS, EncryptedSharedPreferences on</text>
<text x="64" y="2142">Android).</text>
<text x="64" y="2166">	•	Every API call includes the token in Authorization header: Bearer &lt;token&gt;.</text>
<text x="64" y="2190">	•	API middleware decodes the token and reads userId + role.</text>
<text x="64" y="2214">	•	If token is expired → API returns 401 Unauthorized → app redirects to login page.</text>
<text x="64" y="2238">	•	User can manually logout → app deletes token from local storage.</text>
<text x="64" y="2262">	•	Admin can invalidate all tokens for a user (e.g., if account is suspended).</text>
<text x="64" y="2286"> </text>
<text x="64" y="2310">4.5 Edge Cases &amp; Error Handling</text>
<text x="64" y="2334">Scenario</text>
<text x="64" y="2358">System Behavior</text>
<text x="64" y="2382">User Message Shown</text>
<text x="64" y="2406">OTP entered after 5 minutes</text>
<text x="64" y="2430">Redis key expired → OTP not found → reject</text>
<text x="64" y="2454">'OTP की समय-सीमा समाप्त हो गई। दोबारा भेजें।'</text>
<text x="64" y="2478">Wrong OTP entered</text>
<text x="64" y="2502">Mismatch in Redis → reject, increment attempt counter</text>
<text x="64" y="2526">'गलत OTP। फिर से दर्ज करें।'</text>
<text x="64" y="2550">3 wrong OTP attempts</text>
<text x="64" y="2574">Lock the mobile number for 15 minutes in Redis</text>
<text x="64" y="2598">'बहुत अधिक प्रयास। 15 मिनट बाद पुनः प्रयास करें।'</text>
<text x="64" y="2622">SMS not delivered</text>
<text x="64" y="2646">Provide 'Resend OTP' button — available after 30 seconds</text>
<text x="64" y="2670">'OTP नहीं मिला? 30 सेकंड बाद दोबारा भेजें।'</text>
<text x="64" y="2694">User uses two devices</text>
<text x="64" y="2718">Both can have valid tokens simultaneously (allowed)</text>
<text x="64" y="2742">Both sessions work normally</text>
<text x="64" y="2766">Token used after admin revokes</text>
<text x="64" y="2790">Token blacklisted in Redis → 401 returned</text>
<text x="64" y="2814">User redirected to login</text>
<text x="64" y="2838">Invalid mobile format</text>
<text x="64" y="2862">Frontend validates before API call</text>
<text x="64" y="2886">'कृपया सही 10-अंकीय मोबाइल नंबर डालें।'</text>
<text x="64" y="2910"> </text>
</g>
</svg>
