<text x="64" y="78"> </text>
<text x="64" y="102">13. Folder Structure (High-Level)</text>
<text x="64" y="126">13.1 Next.js Web Frontend Structure</text>
<text x="64" y="150">The web frontend follows Next.js App Router conventions. Each folder represents a feature or</text>
<text x="64" y="174">domain.</text>
<text x="64" y="198"> </text>
<text x="64" y="222">Folder / File</text>
<text x="64" y="246">Purpose</text>
<text x="64" y="270">Key Contents</text>
<text x="64" y="294">app/</text>
<text x="64" y="318">Next.js App Router root — all pages live here</text>
<text x="64" y="342">page.tsx files for each route</text>
<text x="64" y="366">app/(public)/</text>
<text x="64" y="390">Pages accessible without login</text>
<text x="64" y="414">home, services, [service-id], blog, branches</text>
<text x="64" y="438">app/(auth)/</text>
<text x="64" y="462">Authentication pages</text>
<text x="64" y="486">login, verify-otp</text>
<text x="64" y="510">app/(user)/</text>
<text x="64" y="534">Protected user pages — require USER role</text>
<text x="64" y="558">bookings, profile, reviews, booking/confirm</text>
<text x="64" y="582">app/admin/</text>
<text x="64" y="606">Admin panel — requires ADMIN role</text>
<text x="64" y="630">dashboard, bookings, services, staff, offers, users</text>
<text x="64" y="654">components/</text>
<text x="64" y="678">Reusable UI components</text>
<text x="64" y="702">ServiceCard, SlotGrid, BookingStatusBadge, HindiDatePicker, StarRating, Navbar, Footer</text>
<text x="64" y="726">lib/</text>
<text x="64" y="750">Utility functions and API client</text>
<text x="64" y="774">api.ts (all API call functions), auth.ts (token helpers), utils.ts</text>
<text x="64" y="798">hooks/</text>
<text x="64" y="822">Custom React hooks</text>
<text x="64" y="846">useBookings, useServices, useAuth, useSlots</text>
<text x="64" y="870">store/</text>
<text x="64" y="894">Global state management (Zustand or Redux)</text>
<text x="64" y="918">authStore, bookingStore, notificationStore</text>
<text x="64" y="942">public/</text>
<text x="64" y="966">Static assets</text>
<text x="64" y="990">logo.png, brand images, favicon</text>
<text x="64" y="1014">locales/</text>
<text x="64" y="1038">Hindi translations</text>
<text x="64" y="1062">hi.json — all UI text strings in Hindi</text>
<text x="64" y="1086">middleware.ts</text>
<text x="64" y="1110">Route protection</text>
<text x="64" y="1134">Checks token, redirects unauthenticated users to login</text>
<text x="64" y="1158"> </text>
<text x="64" y="1182">13.2 React Native Mobile App Structure</text>
<text x="64" y="1206">Folder / File</text>
<text x="64" y="1230">Purpose</text>
<text x="64" y="1254">src/screens/</text>
<text x="64" y="1278">One folder per major screen: HomeScreen, ServicesScreen, BookingScreen, ProfileScreen,</text>
<text x="64" y="1302">AppointmentsScreen</text>
<text x="64" y="1326">src/components/</text>
<text x="64" y="1350">Reusable components: ServiceCard, SlotSelector, BookingCard, OTPInput, StarRating</text>
<text x="64" y="1374">src/navigation/</text>
<text x="64" y="1398">Navigation config: BottomTabNavigator, AuthStack, UserStack, AdminStack</text>
<text x="64" y="1422">src/api/</text>
<text x="64" y="1446">All API call functions organized by feature: auth.api.ts, booking.api.ts, services.api.ts</text>
<text x="64" y="1470">src/store/</text>
<text x="64" y="1494">Zustand or Redux slices: auth.store.ts, booking.store.ts</text>
<text x="64" y="1518">src/utils/</text>
<text x="64" y="1542">Helpers: dateFormatter.ts, currencyFormatter.ts, validators.ts</text>
<text x="64" y="1566">src/assets/</text>
<text x="64" y="1590">Images, icons, fonts (Noto Sans Devanagari)</text>
<text x="64" y="1614">src/locales/</text>
<text x="64" y="1638">Hindi translations: hi.json</text>
<text x="64" y="1662">app.json</text>
<text x="64" y="1686">App config: name, version, permissions (camera, notifications)</text>
<text x="64" y="1710">android/ + ios/</text>
<text x="64" y="1734">Native platform config — managed by Expo or React Native CLI</text>
<text x="64" y="1758"> </text>
<text x="64" y="1782">13.3 Backend (Node.js/NestJS) Structure</text>
<text x="64" y="1806">Folder / File</text>
<text x="64" y="1830">Purpose</text>
<text x="64" y="1854">src/modules/auth/</text>
<text x="64" y="1878">OTP generation, verification, JWT issuance, logout</text>
<text x="64" y="1902">src/modules/services/</text>
<text x="64" y="1926">Service CRUD, category management, search</text>
<text x="64" y="1950">src/modules/bookings/</text>
<text x="64" y="1974">Booking creation, slot logic, status management, conflict detection</text>
<text x="64" y="1998">src/modules/reviews/</text>
<text x="64" y="2022">Review submission, listing, admin moderation</text>
<text x="64" y="2046">src/modules/users/</text>
<text x="64" y="2070">User profile, admin user management, suspension</text>
<text x="64" y="2094">src/modules/staff/</text>
<text x="64" y="2118">Staff profiles, scheduling, specialization management</text>
<text x="64" y="2142">src/modules/offers/</text>
<text x="64" y="2166">Promo code creation, validation, usage tracking</text>
<text x="64" y="2190">src/modules/notifications/</text>
<text x="64" y="2214">WhatsApp, SMS, email sending + queue management</text>
<text x="64" y="2238">src/modules/admin/</text>
<text x="64" y="2262">Dashboard aggregation, reports, bulk actions</text>
<text x="64" y="2286">src/modules/branches/</text>
<text x="64" y="2310">Branch CRUD, settings, hours management</text>
<text x="64" y="2334">src/middleware/</text>
<text x="64" y="2358">Auth middleware (JWT verify), role guard (RBAC), request logger</text>
<text x="64" y="2382">src/config/</text>
<text x="64" y="2406">Database config, Redis config, environment variables</text>
<text x="64" y="2430">src/shared/</text>
<text x="64" y="2454">Shared DTOs, response helpers, error classes</text>
<text x="64" y="2478">prisma/ or migrations/</text>
<text x="64" y="2502">Database schema and migration files (Prisma ORM recommended)</text>
<text x="64" y="2526"> </text>
</g>
</svg>
