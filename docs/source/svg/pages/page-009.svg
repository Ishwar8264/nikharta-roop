<text x="64" y="102">8. UI/UX Structure</text>
<text x="64" y="126">8.1 Mobile-First Design Strategy</text>
<text x="64" y="150">Over 85% of Nikharta Roop's users will access the app on Android smartphones with screen</text>
<text x="64" y="174">widths of 360–414px. The design starts with mobile layout and expands to tablet/desktop.</text>
<text x="64" y="198">	•	Minimum touch target size: 44x44px for all buttons and interactive elements.</text>
<text x="64" y="222">	•	Bottom navigation bar on mobile (not hamburger menu) — thumb-friendly.</text>
<text x="64" y="246">	•	Single-column layouts on mobile, two-column on tablet, three-column on desktop.</text>
<text x="64" y="270">	•	Critical actions (Book Now, Pay, Confirm) are sticky at the bottom of the screen on</text>
<text x="64" y="294">mobile.</text>
<text x="64" y="318">	•	Forms use native mobile keyboards — numeric keyboard for phone/OTP, text for names.</text>
<text x="64" y="342"> </text>
<text x="64" y="366">8.2 Design System</text>
<text x="64" y="390">Element</text>
<text x="64" y="414">Value / Specification</text>
