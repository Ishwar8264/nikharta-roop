<text x="64" y="1710">4px base, use multiples: 8, 12, 16, 24, 32px</text>
<text x="64" y="1734">Consistent whitespace throughout</text>
<text x="64" y="1758"> </text>
<text x="64" y="1782">8.3 Hindi-First UI Considerations</text>
<text x="64" y="1806">	•	All primary labels, service names, and button text must be in Hindi first.</text>
<text x="64" y="1830">	•	Hindi text requires 20–30% more horizontal space than English — factor into layouts.</text>
<text x="64" y="1854">	•	Use simple, conversational Hindi — avoid formal/bureaucratic language.</text>
<text x="64" y="1878">	•	Example: Use 'अभी बुक करें' (Book Now) not 'नियुक्ति अनुसूचित करें' (Schedule</text>
<text x="64" y="1902">Appointment).</text>
<text x="64" y="1926">	•	Date and time display: use Indian format — 'शनिवार, 15 दिसंबर 2024, दोपहर 11 बजे'.</text>
<text x="64" y="1950">	•	Currency display: '₹ 500' with Rupee symbol — never 'INR 500'.</text>
<text x="64" y="1974">	•	Placeholder text in forms: in Hindi — 'अपना नाम यहाँ लिखें'.</text>
<text x="64" y="1998">	•	Error and success messages: always in Hindi — users trust Hindi over English.</text>
<text x="64" y="2022"> </text>
