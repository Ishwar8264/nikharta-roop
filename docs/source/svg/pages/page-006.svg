<text x="64" y="7470">valid_from</text>
<text x="64" y="7494">TIMESTAMP</text>
<text x="64" y="7518">Yes</text>
<text x="64" y="7542">Offer start date-time</text>
<text x="64" y="7566">valid_until</text>
<text x="64" y="7590">TIMESTAMP</text>
<text x="64" y="7614">Yes</text>
<text x="64" y="7638">Offer end date-time</text>
<text x="64" y="7662">usage_limit</text>
<text x="64" y="7686">INTEGER</text>
<text x="64" y="7710">No</text>
<text x="64" y="7734">Total times this offer can be used</text>
<text x="64" y="7758">usage_count</text>
<text x="64" y="7782">INTEGER</text>
<text x="64" y="7806">Auto</text>
