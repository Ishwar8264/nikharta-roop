<text x="64" y="7950">is_active</text>
<text x="64" y="7974">BOOLEAN</text>
<text x="64" y="7998">Yes</text>
<text x="64" y="8022">Admin can deactivate without deleting</text>
<text x="64" y="8046"> </text>
