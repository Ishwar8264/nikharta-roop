<text x="64" y="9078">5.9 Database Relationships</text>
<text x="64" y="9102">Relationship</text>
<text x="64" y="9126">Type</text>
<text x="64" y="9150">Description</text>
<text x="64" y="9174">Users → Bookings</text>
<text x="64" y="9198">One-to-Many</text>
<text x="64" y="9222">One user can have many bookings over time</text>
<text x="64" y="9246">Services → Bookings</text>
<text x="64" y="9270">One-to-Many</text>
<text x="64" y="9294">One service can be booked many times</text>
<text x="64" y="9318">Staff → Bookings</text>
<text x="64" y="9342">One-to-Many</text>
<text x="64" y="9366">One staff member can handle many bookings</text>
<text x="64" y="9390">Branches → Services</text>
<text x="64" y="9414">One-to-Many</text>
<text x="64" y="9438">One branch offers many services</text>
<text x="64" y="9462">Branches → Staff</text>
<text x="64" y="9486">One-to-Many</text>
<text x="64" y="9510">One branch has many staff members</text>
<text x="64" y="9534">Bookings → Reviews</text>
<text x="64" y="9558">One-to-One</text>
<text x="64" y="9582">Each booking can have at most one review</text>
<text x="64" y="9606">Users → Reviews</text>
<text x="64" y="9630">One-to-Many</text>
<text x="64" y="9654">One user can leave multiple reviews (for different bookings)</text>
<text x="64" y="9678">Offers → Bookings</text>
<text x="64" y="9702">Many-to-Many (via junction)</text>
<text x="64" y="9726">An offer can be applied to many bookings</text>
<text x="64" y="9750"> </text>
