<text x="64" y="40" font-family="Inter, Noto Sans Devanagari, Arial, sans-serif" font-size="18" font-weight="700" fill="#880E4F">NikhartaRoop System Documentation - Page 006</text>
<g font-family="Noto Sans Devanagari, Inter, Arial, sans-serif" font-size="16" fill="#212121">
<text x="64" y="78"> </text>
<text x="64" y="102">5. Database Design</text>
<text x="64" y="126">5.1 Database Overview</text>
<text x="64" y="150">PostgreSQL is used as the primary relational database. It handles structured data with</text>
<text x="64" y="174">relationships. All financial and booking data is stored here. Redis is used as a secondary</text>
<text x="64" y="198">store for ephemeral data like OTPs and caches.</text>
<text x="64" y="222"> </text>
<text x="64" y="246">5.2 Users Table</text>
<text x="64" y="270">Field</text>
<text x="64" y="294">Data Type</text>
<text x="64" y="318">Required</text>
<text x="64" y="342">Description</text>
<text x="64" y="366">id</text>
<text x="64" y="390">UUID / VARCHAR</text>
<text x="64" y="414">Yes (PK)</text>
<text x="64" y="438">Unique user identifier — e.g., usr_92hd83</text>
<text x="64" y="462">mobile</text>
<text x="64" y="486">VARCHAR(10)</text>
<text x="64" y="510">Yes (Unique)</text>
<text x="64" y="534">Indian mobile number — used for login</text>
<text x="64" y="558">name</text>
<text x="64" y="582">VARCHAR(100)</text>
<text x="64" y="606">No (optional)</text>
<text x="64" y="630">User's full name — collected on profile setup</text>
<text x="64" y="654">email</text>
<text x="64" y="678">VARCHAR(150)</text>
<text x="64" y="702">No</text>
<text x="64" y="726">Optional email for receipts</text>
<text x="64" y="750">role</text>
<text x="64" y="774">ENUM</text>
<text x="64" y="798">Yes</text>
<text x="64" y="822">Values: GUEST, USER, STAFF, ADMIN</text>
<text x="64" y="846">branch_id</text>
<text x="64" y="870">FK → Branches</text>
<text x="64" y="894">For STAFF/ADMIN</text>
<text x="64" y="918">Which branch this staff/admin belongs to</text>
<text x="64" y="942">avatar_url</text>
<text x="64" y="966">TEXT</text>
<text x="64" y="990">No</text>
<text x="64" y="1014">Profile photo URL from Cloudinary/S3</text>
<text x="64" y="1038">loyalty_points</text>
<text x="64" y="1062">INTEGER</text>
<text x="64" y="1086">Yes (default: 0)</text>
<text x="64" y="1110">Accumulated loyalty points</text>
<text x="64" y="1134">is_active</text>
<text x="64" y="1158">BOOLEAN</text>
<text x="64" y="1182">Yes</text>
<text x="64" y="1206">false = account suspended</text>
<text x="64" y="1230">created_at</text>
<text x="64" y="1254">TIMESTAMP</text>
<text x="64" y="1278">Auto</text>
<text x="64" y="1302">Account creation timestamp</text>
<text x="64" y="1326">last_login_at</text>
<text x="64" y="1350">TIMESTAMP</text>
<text x="64" y="1374">Auto-updated</text>
<text x="64" y="1398">Last OTP login timestamp</text>
<text x="64" y="1422"> </text>
<text x="64" y="1446">5.3 Services Table</text>
<text x="64" y="1470">Field</text>
<text x="64" y="1494">Data Type</text>
<text x="64" y="1518">Required</text>
<text x="64" y="1542">Description</text>
<text x="64" y="1566">id</text>
<text x="64" y="1590">UUID</text>
<text x="64" y="1614">Yes (PK)</text>
<text x="64" y="1638">Unique service ID</text>
<text x="64" y="1662">name_hi</text>
<text x="64" y="1686">VARCHAR(200)</text>
<text x="64" y="1710">Yes</text>
<text x="64" y="1734">Service name in Hindi — e.g., 'फेशियल'</text>
<text x="64" y="1758">name_en</text>
<text x="64" y="1782">VARCHAR(200)</text>
<text x="64" y="1806">Yes</text>
<text x="64" y="1830">Service name in English — e.g., 'Facial'</text>
<text x="64" y="1854">description_hi</text>
<text x="64" y="1878">TEXT</text>
<text x="64" y="1902">Yes</text>
<text x="64" y="1926">Full description in Hindi</text>
<text x="64" y="1950">category_id</text>
<text x="64" y="1974">FK → Categories</text>
<text x="64" y="1998">Yes</text>
<text x="64" y="2022">Hair Care, Skin Care, Bridal, etc.</text>
<text x="64" y="2046">price</text>
<text x="64" y="2070">DECIMAL(10,2)</text>
<text x="64" y="2094">Yes</text>
<text x="64" y="2118">Base price in INR</text>
<text x="64" y="2142">duration_minutes</text>
<text x="64" y="2166">INTEGER</text>
<text x="64" y="2190">Yes</text>
<text x="64" y="2214">How long the service takes — e.g., 45</text>
<text x="64" y="2238">image_url</text>
<text x="64" y="2262">TEXT</text>
<text x="64" y="2286">No</text>
<text x="64" y="2310">Service photo for display</text>
<text x="64" y="2334">is_active</text>
<text x="64" y="2358">BOOLEAN</text>
<text x="64" y="2382">Yes</text>
<text x="64" y="2406">false = hidden from users</text>
<text x="64" y="2430">branch_id</text>
<text x="64" y="2454">FK → Branches</text>
<text x="64" y="2478">Yes</text>
<text x="64" y="2502">Which branch offers this service</text>
<text x="64" y="2526">created_at</text>
<text x="64" y="2550">TIMESTAMP</text>
<text x="64" y="2574">Auto</text>
<text x="64" y="2598">When service was added</text>
<text x="64" y="2622"> </text>
<text x="64" y="2646">5.4 Bookings Table</text>
<text x="64" y="2670">This is the most critical table. Every appointment ever made is stored here with full</text>
<text x="64" y="2694">history.</text>
<text x="64" y="2718">Field</text>
<text x="64" y="2742">Data Type</text>
<text x="64" y="2766">Required</text>
<text x="64" y="2790">Description</text>
<text x="64" y="2814">id</text>
<text x="64" y="2838">UUID</text>
<text x="64" y="2862">Yes (PK)</text>
<text x="64" y="2886">Unique booking ID — shown to user as 'BK-2024-00123'</text>
<text x="64" y="2910">user_id</text>
<text x="64" y="2934">FK → Users</text>
<text x="64" y="2958">Yes</text>
<text x="64" y="2982">Who made the booking</text>
<text x="64" y="3006">service_id</text>
<text x="64" y="3030">FK → Services</text>
<text x="64" y="3054">Yes</text>
<text x="64" y="3078">Which service was booked</text>
<text x="64" y="3102">staff_id</text>
<text x="64" y="3126">FK → Staff</text>
<text x="64" y="3150">No</text>
<text x="64" y="3174">Assigned beautician (null = any available)</text>
<text x="64" y="3198">branch_id</text>
<text x="64" y="3222">FK → Branches</text>
<text x="64" y="3246">Yes</text>
<text x="64" y="3270">Which branch the booking is at</text>
<text x="64" y="3294">booking_date</text>
<text x="64" y="3318">DATE</text>
<text x="64" y="3342">Yes</text>
<text x="64" y="3366">Date of appointment — e.g., 2024-12-15</text>
<text x="64" y="3390">slot_start</text>
<text x="64" y="3414">TIME</text>
<text x="64" y="3438">Yes</text>
<text x="64" y="3462">Start time — e.g., 11:00</text>
<text x="64" y="3486">slot_end</text>
<text x="64" y="3510">TIME</text>
<text x="64" y="3534">Yes</text>
<text x="64" y="3558">End time — calculated: slot_start + duration</text>
<text x="64" y="3582">status</text>
<text x="64" y="3606">ENUM</text>
<text x="64" y="3630">Yes</text>
<text x="64" y="3654">PENDING, CONFIRMED, IN_PROGRESS, COMPLETED, CANCELLED, NO_SHOW</text>
<text x="64" y="3678">advance_amount</text>
<text x="64" y="3702">DECIMAL(10,2)</text>
<text x="64" y="3726">No</text>
<text x="64" y="3750">Amount paid in advance</text>
<text x="64" y="3774">total_amount</text>
<text x="64" y="3798">DECIMAL(10,2)</text>
<text x="64" y="3822">Yes</text>
<text x="64" y="3846">Full service price</text>
<text x="64" y="3870">payment_id</text>
<text x="64" y="3894">VARCHAR</text>
<text x="64" y="3918">No</text>
<text x="64" y="3942">Razorpay payment reference ID</text>
<text x="64" y="3966">cancellation_reason</text>
<text x="64" y="3990">TEXT</text>
<text x="64" y="4014">No</text>
<text x="64" y="4038">Why cancelled — if applicable</text>
<text x="64" y="4062">notes</text>
<text x="64" y="4086">TEXT</text>
<text x="64" y="4110">No</text>
<text x="64" y="4134">Special instructions from user or admin</text>
<text x="64" y="4158">created_at</text>
<text x="64" y="4182">TIMESTAMP</text>
<text x="64" y="4206">Auto</text>
<text x="64" y="4230">When booking was made</text>
<text x="64" y="4254">updated_at</text>
<text x="64" y="4278">TIMESTAMP</text>
<text x="64" y="4302">Auto-updated</text>
<text x="64" y="4326">Last status change time</text>
<text x="64" y="4350"> </text>
<text x="64" y="4374">5.5 Staff Table</text>
<text x="64" y="4398">Field</text>
<text x="64" y="4422">Data Type</text>
<text x="64" y="4446">Required</text>
<text x="64" y="4470">Description</text>
<text x="64" y="4494">id</text>
<text x="64" y="4518">UUID</text>
<text x="64" y="4542">Yes (PK)</text>
<text x="64" y="4566">Staff unique ID</text>
<text x="64" y="4590">user_id</text>
<text x="64" y="4614">FK → Users</text>
<text x="64" y="4638">Yes</text>
<text x="64" y="4662">Linked to Users table (same login system)</text>
<text x="64" y="4686">branch_id</text>
<text x="64" y="4710">FK → Branches</text>
<text x="64" y="4734">Yes</text>
<text x="64" y="4758">Their assigned branch</text>
<text x="64" y="4782">specialization</text>
<text x="64" y="4806">TEXT[]</text>
<text x="64" y="4830">Yes</text>
<text x="64" y="4854">Array: ['facial', 'bridal_makeup', 'hair_color']</text>
<text x="64" y="4878">experience_years</text>
<text x="64" y="4902">INTEGER</text>
<text x="64" y="4926">No</text>
<text x="64" y="4950">Years of experience</text>
<text x="64" y="4974">bio_hi</text>
<text x="64" y="4998">TEXT</text>
<text x="64" y="5022">No</text>
<text x="64" y="5046">Short bio in Hindi</text>
<text x="64" y="5070">photo_url</text>
<text x="64" y="5094">TEXT</text>
<text x="64" y="5118">No</text>
<text x="64" y="5142">Staff photo</text>
<text x="64" y="5166">rating</text>
<text x="64" y="5190">DECIMAL(3,2)</text>
<text x="64" y="5214">Computed</text>
<text x="64" y="5238">Average rating from reviews — updated after each review</text>
<text x="64" y="5262">is_available</text>
<text x="64" y="5286">BOOLEAN</text>
<text x="64" y="5310">Yes</text>
<text x="64" y="5334">Temporarily unavailable (sick leave etc.)</text>
<text x="64" y="5358">work_days</text>
<text x="64" y="5382">JSONB</text>
<text x="64" y="5406">Yes</text>
<text x="64" y="5430">Working days: {mon:true, tue:true, wed:false, ...}</text>
<text x="64" y="5454">work_start</text>
<text x="64" y="5478">TIME</text>
<text x="64" y="5502">Yes</text>
<text x="64" y="5526">Shift start — e.g., 09:00</text>
<text x="64" y="5550">work_end</text>
<text x="64" y="5574">TIME</text>
<text x="64" y="5598">Yes</text>
<text x="64" y="5622">Shift end — e.g., 19:00</text>
<text x="64" y="5646"> </text>
<text x="64" y="5670">5.6 Reviews Table</text>
<text x="64" y="5694">Field</text>
<text x="64" y="5718">Data Type</text>
<text x="64" y="5742">Required</text>
<text x="64" y="5766">Description</text>
<text x="64" y="5790">id</text>
<text x="64" y="5814">UUID</text>
<text x="64" y="5838">Yes (PK)</text>
<text x="64" y="5862">Review ID</text>
<text x="64" y="5886">user_id</text>
<text x="64" y="5910">FK → Users</text>
<text x="64" y="5934">Yes</text>
<text x="64" y="5958">Who left the review</text>
<text x="64" y="5982">booking_id</text>
<text x="64" y="6006">FK → Bookings</text>
<text x="64" y="6030">Yes (Unique)</text>
<text x="64" y="6054">One review per booking only</text>
<text x="64" y="6078">staff_id</text>
<text x="64" y="6102">FK → Staff</text>
<text x="64" y="6126">No</text>
<text x="64" y="6150">Staff being reviewed</text>
<text x="64" y="6174">service_id</text>
<text x="64" y="6198">FK → Services</text>
<text x="64" y="6222">Yes</text>
<text x="64" y="6246">Service being reviewed</text>
<text x="64" y="6270">rating</text>
<text x="64" y="6294">INTEGER (1–5)</text>
<text x="64" y="6318">Yes</text>
<text x="64" y="6342">Star rating</text>
<text x="64" y="6366">comment_hi</text>
<text x="64" y="6390">TEXT</text>
<text x="64" y="6414">No</text>
<text x="64" y="6438">Review text — Hindi preferred</text>
<text x="64" y="6462">is_approved</text>
<text x="64" y="6486">BOOLEAN</text>
<text x="64" y="6510">Yes (default: true)</text>
<text x="64" y="6534">Admin can hide inappropriate reviews</text>
<text x="64" y="6558">created_at</text>
<text x="64" y="6582">TIMESTAMP</text>
<text x="64" y="6606">Auto</text>
<text x="64" y="6630">When review was submitted</text>
<text x="64" y="6654"> </text>
<text x="64" y="6678">5.7 Offers Table</text>
<text x="64" y="6702">Field</text>
<text x="64" y="6726">Data Type</text>
<text x="64" y="6750">Required</text>
<text x="64" y="6774">Description</text>
<text x="64" y="6798">id</text>
<text x="64" y="6822">UUID</text>
<text x="64" y="6846">Yes (PK)</text>
<text x="64" y="6870">Offer ID</text>
<text x="64" y="6894">code</text>
<text x="64" y="6918">VARCHAR(20)</text>
<text x="64" y="6942">Yes (Unique)</text>
<text x="64" y="6966">Promo code — e.g., 'DIWALI20'</text>
<text x="64" y="6990">title_hi</text>
<text x="64" y="7014">VARCHAR(200)</text>
<text x="64" y="7038">Yes</text>
<text x="64" y="7062">Offer name in Hindi</text>
<text x="64" y="7086">discount_type</text>
<text x="64" y="7110">ENUM</text>
<text x="64" y="7134">Yes</text>
<text x="64" y="7158">PERCENTAGE or FLAT_AMOUNT</text>
<text x="64" y="7182">discount_value</text>
<text x="64" y="7206">DECIMAL(10,2)</text>
<text x="64" y="7230">Yes</text>
<text x="64" y="7254">20 (for 20%) or 200 (for ₹200 off)</text>
<text x="64" y="7278">min_order</text>
<text x="64" y="7302">DECIMAL(10,2)</text>
<text x="64" y="7326">No</text>
