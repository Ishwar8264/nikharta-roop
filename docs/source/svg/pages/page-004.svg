<text x="64" y="102">3. User Roles &amp; Permissions</text>
<text x="64" y="126">3.1 Role Overview</text>
<text x="64" y="150">The system has four distinct roles. Each role has a specific scope of access. Role is stored</text>
<text x="64" y="174">in the user's token and checked on every protected API call.</text>
<text x="64" y="198"> </text>
<text x="64" y="222">Role</text>
<text x="64" y="246">Who Is This?</text>
<text x="64" y="270">Access Scope</text>
<text x="64" y="294">GUEST</text>
<text x="64" y="318">Visitor with no account — can browse only</text>
<text x="64" y="342">Public pages only</text>
<text x="64" y="366">USER</text>
<text x="64" y="390">Registered customer with mobile verified OTP</text>
<text x="64" y="414">Own profile, bookings, reviews</text>
<text x="64" y="438">STAFF</text>
<text x="64" y="462">Beautician / technician at parlour</text>
<text x="64" y="486">Own schedule, assigned bookings</text>
<text x="64" y="510">ADMIN</text>
<text x="64" y="534">Parlour owner or manager</text>
<text x="64" y="558">Full system access including settings</text>
<text x="64" y="582"> </text>
